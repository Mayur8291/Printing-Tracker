name: Refresh Canto data
on:
  workflow_call:
    inputs:
      environment:
        description: Matching DigitalOcean and Supabase environment
        required: true
        type: string
      job_id:
        description: Authorized job UUID created by the admin dashboard
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: canto-refresh-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container: postgres:17.11-bookworm
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.CANTO_SUPABASE_ACCESS_TOKEN }}
      CANTO_BACKUP_KEY: ${{ secrets.CANTO_BACKUP_KEY }}
      CANTO_EXPORT_SSH_KEY: ${{ secrets.CANTO_EXPORT_SSH_KEY }}
      CANTO_SYNC_CONFIG_DIR: /tmp/canto-config
      PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore
      CANTO_ENVIRONMENT: ${{ inputs.environment }}
      CANTO_JOB_ID: ${{ inputs.job_id }}
      CANTO_GITHUB_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install runner dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-venv openssh-client ca-certificates
          python3 -m venv /tmp/canto-venv
          /tmp/canto-venv/bin/pip install --disable-pip-version-check -q -r tools/canto-sync/requirements.txt
      - name: Run the authorized refresh
        run: /tmp/canto-venv/bin/python tools/canto-sync/job_runner.py
      - name: Remove temporary credentials and database files
        if: always()
        run: |
          rm -rf /tmp/canto-config tools/canto-sync/private
