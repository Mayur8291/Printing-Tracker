name: Check Scott API configuration
run-name: ${{ inputs.job_id && format('Canto {0} {1}', inputs.environment, inputs.job_id) || 'Check Scott API configuration' }}

on:
  push:
    branches: [develop, main]
    paths:
      - .github/workflows/check-scott-config.yml
      - scripts/check-scott-secrets.mjs
      - supabase/functions/scott-dashboard-masters/**
  workflow_dispatch:
    inputs:
      environment:
        description: Canto refresh environment (only used with a job ID)
        type: choice
        options: [staging, production]
        default: staging
      job_id:
        description: Authorized Canto refresh job UUID (leave empty for config check)
        type: string
        required: false

permissions:
  contents: read

jobs:
  refresh:
    if: ${{ inputs.job_id != '' }}
    uses: ./.github/workflows/canto-refresh.yml
    with:
      environment: ${{ inputs.environment }}
      job_id: ${{ inputs.job_id }}
    secrets: inherit
  check:
    if: ${{ !inputs.job_id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [scvojtvgnkmbupvyslmb, levwrmvqdntngeasrtnb]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
      - name: Check required Scott secret names
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-scott-secrets.mjs "${{ matrix.project }}"
