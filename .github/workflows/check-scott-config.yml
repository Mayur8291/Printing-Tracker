name: Check Scott API configuration

on:
  push:
    branches: [develop, main]
    paths:
      - .github/workflows/check-scott-config.yml
      - scripts/check-scott-secrets.mjs
      - supabase/functions/scott-dashboard-masters/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [scvojtvgnkmbupvyslmb, levwrmvqdntngeasrtnb]
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: 2.105.0
      - name: Check required Scott secret names
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/check-scott-secrets.mjs "${{ matrix.project }}"
