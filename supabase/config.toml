# Supabase Edge Functions — deploy all admin helpers after changes:
# npx supabase functions deploy admin-create-user
# npx supabase functions deploy admin-delete-user
# npx supabase functions deploy admin-reset-password
# npx supabase functions deploy admin-promote-production
# npx supabase functions deploy request-password-reset
# npx supabase functions deploy check-password-reset-status
# npx supabase functions deploy complete-password-reset
# npx supabase functions deploy admin-review-password-reset
# npx supabase functions deploy admin-list-password-reset-requests
# npx supabase functions deploy scott-dashboard-masters
# npx supabase functions deploy uniware-bridge
# npx supabase functions deploy ops-ai-chat

[functions.admin-create-user]
verify_jwt = true

[functions.admin-delete-user]
verify_jwt = true

[functions.admin-reset-password]
verify_jwt = true

[functions.admin-promote-production]
verify_jwt = true

[functions.request-password-reset]
verify_jwt = false

[functions.check-password-reset-status]
verify_jwt = false

[functions.complete-password-reset]
verify_jwt = false

[functions.admin-review-password-reset]
verify_jwt = true

[functions.admin-list-password-reset-requests]
verify_jwt = true

[functions.dashboard-stock-api]
verify_jwt = false

[functions.admin-test-scott-webhook]
verify_jwt = true

[functions.scott-dashboard-masters]
verify_jwt = true

[functions.uniware-bridge]
verify_jwt = true

[functions.ops-ai-chat]
verify_jwt = true

[functions.canto-refresh]
verify_jwt = false

# Service-only queue pump validates its dedicated Cron secret before any RPC.
[functions.squad-jobs]
verify_jwt = false

# User routes forward the JWT to scoped RPCs before any privileged Storage call.
[functions.squad-account]
verify_jwt = false

# Provider ingress verifies the exact raw-body HMAC and durable environment gate.
[functions.squad-webhooks]
verify_jwt = false
